name: CI

on:
  push:
    branches:
      - main
      - "refactor/**"

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore API
        run: dotnet restore WebApi_Funcionarios/WebApi_ASPNETCore.csproj

      - name: Restore Tests
        run: dotnet restore WebApi_ASPNETCore.Tests/WebApi_ASPNETCore.Tests.csproj

      - name: Build
        run: >
          dotnet build
          WebApi_Funcionarios/WebApi_ASPNETCore.csproj
          --configuration Release
          --no-restore

      - name: Test
        run: >
          dotnet test
          WebApi_ASPNETCore.Tests/WebApi_ASPNETCore.Tests.csproj
          --configuration Release
          --no-restore
          --verbosity normal
