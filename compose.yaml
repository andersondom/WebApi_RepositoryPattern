services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: funcionarios-sqlserver

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SQLSERVER_SA_PASSWORD}"

    ports:
      - "1433:1433"

    volumes:
      - sqlserver-data:/var/opt/mssql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s


  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: funcionarios-api

    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:8080"

      ConnectionStrings__ConexaoPadrao: "Server=sqlserver,1433;Database=FuncionarioPattern;User Id=sa;Password=${SQLSERVER_SA_PASSWORD};TrustServerCertificate=True"

    ports:
      - "8080:8080"

    depends_on:
      sqlserver:
        condition: service_healthy

volumes:
  sqlserver-data:
